<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1513"/>
      <stop offset="100%" stop-color="#110E0D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B28F"/>
      <stop offset="100%" stop-color="#C0784A"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D69D78" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C0784A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Deep Atelier Charcoal Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Subtle Architectural Border -->
  <rect x="18" y="18" width="476" height="476" rx="88" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Geometric Woodcraft Diamond / Accent (represents the É in LUXAVÉN and craftsmanship precision) -->
  <polygon points="364,124 388,148 364,172 340,148" fill="url(#accentGrad)"/>

  <!-- Architectural 'L' Monogram in Cormorant Garamond proportions -->
  <!-- Top bracketed serif -->
  <path d="M 148 140 L 228 140 L 228 154 C 214 155 204 162 204 176 L 204 336 C 204 348 214 354 232 354 L 332 354 C 352 354 362 346 366 326 L 374 326 L 368 376 L 148 376 L 148 362 C 164 360 174 352 174 338 L 174 176 C 174 162 164 155 148 154 Z" fill="#FBF9F7"/>
</svg>